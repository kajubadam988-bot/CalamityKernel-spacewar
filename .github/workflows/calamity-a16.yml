name: Build crDroid 13 Kernel (Backslashxx KSU)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        default: 'vendor/lahaina-qgki_defconfig'
      anykernel_branch:
        description: 'William24hmar/AnyKernel3 branch'
        default: 'master'
      build_tag:
        default: 'crDroid13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backslashxx KernelSU (Syscall Table Tampering, no SUSFS)
        run: |
          set -e
          # replace crDroid's in-tree KernelSU with backslashxx KernelSU
          rm -rf drivers/kernelsu KernelSU
          git clone --depth=1 https://github.com/backslashxx/KernelSU.git KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
          # replace old KSU/SUSFS config with backslashxx config
          D="arch/arm64/configs/${{ inputs.defconfig }}"
          sed -i '/KSU/d' "$D"
          printf '\n# KernelSU (backslashxx)\nCONFIG_KSU=y\nCONFIG_KSU_TAMPER_SYSCALL_TABLE=y\n' >> "$D"
          grep -n "KSU" "$D"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq bc bison flex libssl-dev make libelf-dev lz4 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler \
            python3 zip unzip git ccache wget curl xz-utils clang lld

      - name: Slim LLVM toolchain
        run: |
          V=23.1.3; N=llvm-$V-x86_64
          mkdir -p $HOME/tc && cd $HOME/tc
          wget -q https://mirrors.edge.kernel.org/pub/tools/llvm/files/$N.tar.xz
          tar -xJf $N.tar.xz
          echo "$HOME/tc/$N/bin" >> $GITHUB_PATH

      - name: mkdtboimg
        run: |
          wget -q "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" -O m.b64
          base64 -d m.b64 | sudo tee /usr/local/bin/mkdtboimg.py > /dev/null
          sudo chmod +x /usr/local/bin/mkdtboimg.py
          python3 /usr/local/bin/mkdtboimg.py --help > /dev/null

      - name: Build
        run: |
          set -eo pipefail
          make O=out ARCH=arm64 "${{ inputs.defconfig }}"
          scripts/config --file out/.config --disable COMPAT_VDSO --disable THUMB2_COMPAT_VDSO
          grep -E "CONFIG_KSU" out/.config
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 CC=clang AR=llvm-ar NM=llvm-nm \
            LD="ld.lld -S" OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-strict-prototypes -Wno-deprecated-non-prototype -Wno-implicit-int -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-function-pointer-types -Wno-error" \
            2>&1 | tee build.log
          [ -f out/arch/arm64/boot/Image ]

      - name: Show first errors
        if: failure()
        run: grep -n -E "error:|undefined reference|undefined symbol|No rule to make|Error 1" build.log | head -30

      - name: dtbo.img (only if overlays were built)
        run: |
          D=out/arch/arm64/boot/dts
          LIST=$(find $D -name '*.dtbo' | sort)
          if [ -n "$LIST" ]; then
            python3 /usr/local/bin/mkdtboimg.py create out/arch/arm64/boot/dtbo.img $LIST
          else
            echo "No .dtbo built - zip will contain Image only"
          fi

      - name: AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/William24hmar/AnyKernel3.git -b "${{ inputs.anykernel_branch }}" ak
          cp out/arch/arm64/boot/Image ak/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ak/ || true
          N="Kernel-${{ inputs.build_tag }}-BXKSU-$(date +%Y%m%d-%H%M).zip"
          (cd ak && zip -r9 "../$N" . -x "*.git*" -x README.md)
          echo "ZIP=$N" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
